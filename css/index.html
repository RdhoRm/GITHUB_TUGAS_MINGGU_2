<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portofolio</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    
    <header class="header">
        <div class="logo">Portofolio</div>
        <nav class="navbar">

            <a href="hero">Home</a>
            <a href="about">About Me</a>
            <a href="showcase">Showcase</a>
        </nav>
    </header>

    <main>
        <section id="hero" class="hero-section">

            <div class="hero-content">
                <p class="greeting">Hello, I'm ridho ramadhan</p>
                <h1 class="hero-title">Web Developer</h1>

            </div>

            <blockquote class="hero-quote">
                "The only way to do great work is to love what you do."
                <cite>Steve Jobs</cite>
            </blockquote>

            <div class="hero-image">
                <img src="gambar.png" alt="Hero Image">
            </div>
        </section>


     <section id=showcase class="showcase-section">
            <div class="showcase-container">
                <h2 class="showcase-title">showcase saya</h2>
                <div class="showcase-grid">
                    <article class="showcase-card">
                        <img src="gambar.png" alt="Project 1">
                        <h3>Project kopdes</h3>
                        <p>Description of Project 1.</p>
                    </article>
                </div>
            </div>
        </section>
    </main>


    <footer>
        <p>Made by ridho ramadhan - Praktikum CSS</p>
    </footer>


</body>
</html>
