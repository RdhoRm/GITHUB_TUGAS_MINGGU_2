<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Pendaftaran Praktikan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-8 font-sans">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-md shadow-sm border border-gray-200">
        <h2 class="text-xl font-bold mb-6 text-center">FORMULIR PENDAFTARAN PRAKTIKAN</h2>
        
        <form action="table.html" method="GET">
            <table class="w-full">
                <tr class="align-top">
                    <td class="py-2 w-1/4">NIM</td>
                    <td class="py-2 px-2">:</td>
                    <td class="py-2"><input type="text" name="nim" id="nim" value="103082400026" readonly class="w-full border border-gray-300 rounded px-3 py-1 bg-gray-100 text-gray-500 cursor-not-allowed"></td>
                </tr>
                <tr class="align-top">
                    <td class="py-2">Username</td>
                    <td class="py-2 px-2">:</td>
                    <td class="py-2"><input type="text" name="username" id="username" value="Ridho Ramadhan" disabled class="w-full border border-gray-300 rounded px-3 py-1 bg-gray-100 text-gray-500 cursor-not-allowed"></td>
                </tr>
                <tr class="align-top">
                    <td class="py-2">Email</td>
                    <td class="py-2 px-2">:</td>
                    <td class="py-2"><input type="email" name="email" id="email" required class="w-full border border-gray-300 rounded px-3 py-1 focus:outline-none focus:border-gray-500"></td>
                </tr>
                <tr class="align-top">
                    <td class="py-2">Password</td>
                    <td class="py-2 px-2">:</td>
                    <td class="py-2"><input type="password" name="password" id="password" required class="w-full border border-gray-300 rounded px-3 py-1 focus:outline-none focus:border-gray-500"></td>
                </tr>
                <tr class="align-top">
                    <td class="py-2">Jenis Kelamin</td>
                    <td class="py-2 px-2">:</td>
                    <td class="py-2">
                        <label class="mr-4"><input type="radio" name="gender" value="Laki-Laki" class="mr-1"> Laki-Laki</label>
                        <label><input type="radio" name="gender" value="Perempuan" class="mr-1"> Perempuan</label>
                    </td>
                </tr>
                <tr class="align-top">
                    <td class="py-2">Minat</td>
                    <td class="py-2 px-2">:</td>
                    <td class="py-2 flex flex-col gap-1">
                        <label><input type="checkbox" name="minat[]" id="minat" value="Renang" class="mr-1"> Renang</label>
                        <label><input type="checkbox" name="minat[]" id="minat" value="Bersepeda" class="mr-1"> Bersepeda</label>
                        <label><input type="checkbox" name="minat[]" id="minat" value="Memancing" class="mr-1"> Berlari</label>
                    </td>
                </tr>
                <tr class="align-top">
                    <td class="py-2">Jenjang Pendidikan</td>
                    <td class="py-2 px-2">:</td>
                    <td class="py-2">
                        <select name="pendidikan" class="w-full border border-gray-300 rounded px-3 py-1 focus:outline-none focus:border-gray-500 bg-white">
                            <option value="" selected>---PILIH---</option>
                            <option value="D3">D3</option>
                            <option value="S1">S1</option>
                            <option value="S2">S2</option>
                            <option value="S3">S3</option>
                        </select>
                    </td>
                </tr>
                <tr class="align-top">
                    <td class="py-2">Upload Foto</td>
                    <td class="py-2 px-2">:</td>
                    <td class="py-2"><input type="file" name="foto" class="text-sm text-gray-500 file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-sm file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300 cursor-pointer"></td>
                </tr>
                <tr class="align-top">
                    <td class="py-2">Harapan</td>
                    <td class="py-2 px-2">:</td>
                    <td class="py-2"><textarea name="harapan" cols="50%" rows="5" class="w-full border border-gray-300 rounded px-3 py-1 focus:outline-none focus:border-gray-500"></textarea></td>
                </tr>
                <tr>
                    <td class="py-4"></td>
                    <td></td>
                    <td class="py-4 flex gap-2">
                        <button type="button" class="bg-gray-200 text-gray-700 px-4 py-1.5 rounded hover:bg-gray-300 transition text-sm">Cancel</button>
                        <button type="submit" class="bg-gray-700 text-white px-4 py-1.5 rounded hover:bg-gray-800 transition text-sm">Submit</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
