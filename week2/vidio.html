<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Halaman Gambar dan Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-8 font-sans">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-md shadow-sm border border-gray-200">
        <table class="w-full">
            <tr>
                <td class="pb-4">
                    <img src="gambar.jpg" alt="Poster Edukasi COVID-19" class="w-full h-auto rounded border border-gray-200">
                </td>
            </tr>
            <tr>
                <td class="py-4">
                    <p class="text-gray-700 text-justify leading-relaxed">
                        Penyakit virus corona (COVID-19) adalah penyakit menular yang disebabkan
                        oleh virus corona yang baru-baru ini ditemukan. Sebagian besar orang yang tertular
                        COVID-19 akan mengalami gejala ringan hingga sedang, dan akan pulih tanpa penanganan khusus.
                    </p>
                </td>
            </tr>
            <tr>
                <td class="pt-4">
                    <video controls class="w-full h-auto rounded border border-gray-200 shadow-sm">
                        <source src="video.mp4" type="video/mp4">
                    </video>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
