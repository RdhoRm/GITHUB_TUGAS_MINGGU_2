<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Gambar dan Video</title>
    <!-- Menghubungkan ke file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content-box">
            <table class="media-table">
                <tr>
                    <td class="media-cell top-cell">
                        <img src="gambar.jpg" alt="Poster Edukasi COVID-19" class="media-item">
                    </td>
                </tr>
                <tr>
                    <td class="text-cell">
                        <p>
                            Penyakit virus corona (COVID-19) adalah penyakit menular yang disebabkan
                            oleh virus corona yang baru-baru ini ditemukan. Sebagian besar orang yang tertular
                            COVID-19 akan mengalami gejala ringan hingga sedang, dan akan pulih tanpa penanganan khusus.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td class="media-cell bottom-cell">
                        <video controls class="media-item">
                            <source src="video.mp4" type="video/mp4">
                        </video>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
